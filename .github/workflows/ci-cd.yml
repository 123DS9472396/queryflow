name: Enterprise Data Pipeline CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test_and_lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
        
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
        
    - name: Lint with Flake8
      run: |
        flake8 backend/ scripts/ dags/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
        
    - name: Run Data Quality Tests (Great Expectations mock)
      run: |
        python tests/data_quality.py

  deploy_backend:
    needs: test_and_lint
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Render Deployment
        run: echo "Triggering Render API for backend deployment..."

  deploy_frontend:
    needs: test_and_lint
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Vercel Deployment
        run: echo "Triggering Vercel webhook for frontend deployment..."
