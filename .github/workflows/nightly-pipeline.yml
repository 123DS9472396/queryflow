name: Nightly Data Pipeline Orchestration

# ── This workflow REPLACES Apache Airflow ────────────────────────────────────
# Runs a full ETL + data quality pipeline every night at midnight UTC.
# This is genuine, real, scheduled pipeline orchestration — visible on GitHub.
# On resume: "Automated nightly data pipeline via GitHub Actions cron orchestration"

on:
  schedule:
    - cron: '0 0 * * *'          # Every day at midnight UTC
  workflow_dispatch:               # Also allows manual trigger from GitHub UI
    inputs:
      run_mode:
        description: 'Pipeline mode (dry-run or live)'
        required: false
        default: 'dry-run'

jobs:
  # ── Stage 1: Data Quality Gate ─────────────────────────────────────────────
  data_quality_check:
    name: "Stage 1 — Data Quality Validation"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install pandas

      - name: Run Great Expectations data quality checks
        run: python tests/data_quality.py

      - name: Report quality gate result
        if: success()
        run: echo "✅ Data quality gate passed — pipeline continues."

  # ── Stage 2: Batch ETL (Bronze → Silver) ───────────────────────────────────
  batch_etl:
    name: "Stage 2 — Batch ETL (Extract → Transform → Load)"
    runs-on: ubuntu-latest
    needs: data_quality_check        # Only runs if Stage 1 passes
    env:
      CH_HOST:              ${{ secrets.CH_HOST }}
      CH_PASSWORD:          ${{ secrets.CH_PASSWORD }}
      CH_PORT:              "8443"
      CH_USER:              default
      CH_DATABASE:          nyc_taxi
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install ETL dependencies
        run: pip install pandas clickhouse-connect python-dotenv

      - name: Run Nightly Batch ETL Pipeline
        run: python scripts/batch_etl.py

      - name: Upload Data Lake Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nightly-data-lake
          path: data_lake/
          retention-days: 7

      - name: ETL pipeline success
        if: success()
        run: echo "✅ Batch ETL complete — Data Lake artifact saved."

  # ── Stage 2.5: dbt Medallion Architecture ──────────────────────────────────
  dbt_medallion_models:
    name: "Stage 2.5 — dbt Medallion Models (Silver → Gold)"
    runs-on: ubuntu-latest
    needs: batch_etl
    env:
      CH_HOST:              ${{ secrets.CH_HOST }}
      CH_PASSWORD:          ${{ secrets.CH_PASSWORD }}
      CH_USER:              default
      CH_DATABASE:          nyc_taxi
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dbt and ClickHouse adapter
        run: pip install dbt-core dbt-clickhouse

      - name: Run dbt models (Bronze → Silver → Gold)
        run: dbt run --project-dir dbt --profiles-dir dbt
        
      - name: Run dbt tests
        run: dbt test --project-dir dbt --profiles-dir dbt

  # ── Stage 3: Redis Streams Health Check ───────────────────────────────────
  redis_stream_check:
    name: "Stage 3 — Redis Streams Health Check"
    runs-on: ubuntu-latest
    needs: batch_etl
    env:
      REDIS_HOST:       ${{ secrets.REDIS_HOST }}
      REDIS_PORT:       "6379"
      REDIS_PASSWORD:   ${{ secrets.REDIS_PASSWORD }}
      REDIS_STREAM_KEY: nyc-taxi-events
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Redis dependency
        run: pip install redis python-dotenv

      - name: Stream 10 test events to Upstash Redis Streams
        run: python -c "
import sys
sys.path.insert(0, 'scripts')
from stream_producer import run_producer
run_producer(num_events=10, delay_ms=100)
"

      - name: Redis stream check success
        if: success()
        run: echo "✅ Redis Streams health check passed — 10 events appended to stream."


  # ── Stage 4: Pipeline Summary Report ──────────────────────────────────────
  pipeline_report:
    name: "Stage 4 — Pipeline Summary"
    runs-on: ubuntu-latest
    needs: [data_quality_check, batch_etl, dbt_medallion_models, redis_stream_check]
    if: always()
    steps:
      - name: Print pipeline summary
        run: |
          echo "========================================"
          echo "  QueryFlow Nightly Pipeline Report"
          echo "  Date: $(date -u)"
          echo "========================================"
          echo "Stage 1 — Data Quality:      ${{ needs.data_quality_check.result }}"
          echo "Stage 2 — Batch ETL (R2):    ${{ needs.batch_etl.result }}"
          echo "Stage 2.5 — dbt Models:      ${{ needs.dbt_medallion_models.result }}"
          echo "Stage 3 — Redis Streams:     ${{ needs.redis_stream_check.result }}"
          echo "========================================"
